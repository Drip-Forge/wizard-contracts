[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
cache_path = "cache"
fs_permissions = [{ access = "read", path = "./"}]

optimizer = true
optimizer_runs = 200
solc = "0.8.20"
evm_version = "shanghai"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
